<div class="login-box">
  <h2>Đăng nhập</h2>
  <p>Chào mừng bạn quay trở lại!</p>

  <form>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="Nhập email">
    </div>

    <div class="form-group">
      <label for="password">Mật khẩu</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="Nhập mật khẩu">
    </div>

    <button type="submit">
      Đăng nhập
    </button>

  </form>
</div>
