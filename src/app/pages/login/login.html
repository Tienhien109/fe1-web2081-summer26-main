<div class="login-box">
  <h2>Đăng nhập</h2>
  <p>Chào mừng bạn quay trở lại!</p>

  <form [formGroup]="loginForm" (ngSubmit)="submit()">

    <div class="form-group">
      <label>Email</label>

      <input
        type="email"
        formControlName="email"
        placeholder="Nhập email">

      <small
        *ngIf="loginForm.get('email')?.touched &&
               loginForm.get('email')?.errors?.['required']">
        Không được để trống Email
      </small>

      <small
        *ngIf="loginForm.get('email')?.touched &&
               loginForm.get('email')?.errors?.['email']">
        Email không hợp lệ
      </small>

    </div>

    <div class="form-group">
      <label>Mật khẩu</label>

      <input
        type="password"
        formControlName="password"
        placeholder="Nhập mật khẩu">

      <small
        *ngIf="loginForm.get('password')?.touched &&
               loginForm.get('password')?.errors?.['required']">
        Không được để trống Password
      </small>

      <small
        *ngIf="loginForm.get('password')?.touched &&
               loginForm.get('password')?.errors?.['minlength']">
        Password tối thiểu 6 ký tự
      </small>

    </div>

    <button type="submit">
      Đăng nhập
    </button>

  </form>
</div>
